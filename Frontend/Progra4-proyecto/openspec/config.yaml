context: |
  App root: proyecto-Cafe-UNA.
  Stack: React 19, Vite 8, JavaScript/JSX, and native ES modules.
  Routing: TanStack Router with route definitions in src/router.jsx.
  Data access: feature services use a shared REST API client; session state uses browser storage.
  UI: Tailwind CSS 4, scoped CSS, Radix/shadcn dependencies, and Lucide icons.
  Architecture: Pages compose Components/hooks/lib, which call service modules and the backend API.
  Deployment: Netlify configuration is present; no repository CI workflow was detected.
  Quality baseline: production build passes, while ESLint currently reports existing violations.

