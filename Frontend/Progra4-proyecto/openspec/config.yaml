rules:
  proposal:
    - Keep each change small enough for one focused pull request.
    - State frontend/backend contract dependencies and an explicit rollback plan for risky changes.
    - Separate product inventory, production assets, transfers, and sales concerns.
  specs:
    - Use RFC 2119 keywords for normative requirements.
    - Write acceptance scenarios in Given/When/Then form.
    - Include authorization, accessibility, loading, empty, validation, and error states when applicable.
  design:
    - Document component boundaries, data flow, API contracts, and architecture decisions with rationale.
    - Reuse established design tokens and accessible UI primitives before adding one-off styles.
    - Include responsive behavior and a sequence diagram for multi-step transactional flows.
  tasks:
    - Group tasks by reviewable implementation phase and use hierarchical numbering.
    - Keep each task independently verifiable and suitable for one work session.
    - Identify the repository, branch, dependencies, and validation command for every task.
  apply:
    guidelines:
      - Implement only the approved task batch.
      - Follow existing project conventions unless the approved design explicitly replaces them.
      - Do not mix unrelated refactors with feature work.
      - Preserve the separation between product catalog data and stock per location.
    tdd: false
    test_command: ""
    lint_command: npm --prefix proyecto-Cafe-UNA run lint
    build_command: npm --prefix proyecto-Cafe-UNA run build
  verify:
    test_command: ""
    lint_command: npm --prefix proyecto-Cafe-UNA run lint
    build_command: npm --prefix proyecto-Cafe-UNA run build
    coverage_threshold: 0
    guidelines:
      - Compare behavior against every approved acceptance scenario.
      - Report baseline failures separately from regressions introduced by the change.
  archive:
    - Require explicit approval before merging destructive or data-migration deltas.
    - Preserve archived change artifacts as an immutable audit trail.
